apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      securityContext:
        fsGroup: 1000
      volumes:
      - name: app-logs
        persistentVolumeClaim:
          claimName: app-logs-pvc
      containers:
      - name: notification
        image: singmeychy/roomy-notification:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5006
        envFrom:
        - secretRef:
            name: room-booking-secret
        env:
        - name: SERVICE_NAME
          value: notification
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: app-logs
          mountPath: /var/log/app
        readinessProbe:
          httpGet:
            path: /health
            port: 5006
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5006
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notification
spec:
  selector:
    app: notification
  ports:
  - port: 5006
    targetPort: 5006
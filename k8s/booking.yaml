apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking
  template:
    metadata:
      labels:
        app: booking
    spec:
      securityContext:
        fsGroup: 1000
      volumes:
      - name: app-logs
        persistentVolumeClaim:             
          claimName: app-logs-pvc        
      containers:
      - name: booking
        image: singmeychy/roomy-booking:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5004
        envFrom:
        - secretRef:
            name: room-booking-secret
        - configMapRef:
            name: room-booking-config
        env:
        - name: INSTANCE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SERVICE_NAME              
          value: booking                   
        - name: POD_NAME                   
          valueFrom:                       
            fieldRef:                      
              fieldPath: metadata.name    
        volumeMounts:
        - name: app-logs
          mountPath: /var/log/app
        readinessProbe:
          httpGet:
            path: /health
            port: 5004
          initialDelaySeconds: 5
          periodSeconds: 10
      - name: log-viewer
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: app-logs
          mountPath: /usr/share/nginx/html/logs
          readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: booking
spec:
  selector:
    app: booking
  ports:
  - port: 5004
    targetPort: 5004
---
apiVersion: v1
kind: Service
metadata:
  name: booking-logs
spec:
  selector:
    app: booking
  ports:
  - port: 80
    targetPort: 80